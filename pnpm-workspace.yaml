packages:
  - apps/*
  - packages/*
  - services/api

ignoredBuiltDependencies:
  - '@nestjs/core'
  - msgpackr-extract
  - unrs-resolver

onlyBuiltDependencies:
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - sharp

# Transitive dependency pins. Most are security patches — bumping a vulnerable
# version that a dependency pulls in indirectly. These MUST live here and not in
# package.json's "pnpm" field: pnpm 11 no longer reads that field, so keeping
# them there silently dropped every pin during Docker builds.
overrides:
  axios: ^1.18.1
  body-parser: ^1.20.6
  brace-expansion@1: ^1.1.12
  brace-expansion@2: ^2.0.2
  defu: ^6.1.5
  effect: ^3.20.0
  fast-xml-parser: ^5.7.0
  form-data: ^4.0.6
  js-yaml@4: ^4.1.1
  lodash: ^4.17.21
  minimatch@3: ^3.1.2
  minimatch@5: ^5.1.6
  minimatch@9: ^9.0.5
  multer: ^2.2.0
  nanoid@3: ^3.3.11
  nodemailer: ^9.0.1
  path-to-regexp@0: ^0.1.13
  postcss: ^8.5.18
  sharp: ^0.35.0
  tmp: ^0.2.6
