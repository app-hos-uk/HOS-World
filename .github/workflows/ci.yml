name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
      JWT_SECRET: 'test-secret-minimum-32-chars-long-for-ci'
      JWT_REFRESH_SECRET: 'test-refresh-secret-minimum-32-chars-for-ci'
      NEXT_PUBLIC_API_URL: 'http://localhost:3001/api'
      ACCESS_CONTROL_STRICT_COVERAGE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=critical 2>&1 || echo "::warning::pnpm audit found vulnerabilities — review output above"
        continue-on-error: true

      - name: Generate Prisma client
        run: cd services/api && npx prisma generate

      - name: Push schema to test DB
        run: cd services/api && npx prisma db push --skip-generate

      - name: Build shared packages
        run: |
          pnpm --filter @hos-marketplace/shared-types build || true
          pnpm --filter @hos-marketplace/utils build || true
          pnpm --filter @hos-marketplace/theme-system build || true
          pnpm --filter @hos-marketplace/api-client build

      - name: Type check API & Web (parallel)
        run: |
          cd services/api && npx tsc --noEmit &
          PID_API=$!
          cd apps/web && npx tsc --noEmit &
          PID_WEB=$!
          wait $PID_API || exit 1
          wait $PID_WEB || exit 1

      - name: Run API tests with coverage
        run: cd services/api && npx jest --coverage --coverageReporters=text --coverageReporters=json-summary

      - name: Check coverage threshold & regression
        run: |
          COVERAGE_FILE="services/api/coverage/coverage-summary.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "::error::Coverage report not found"
            exit 1
          fi
          LINES=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.lines.pct)")
          STMTS=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.statements.pct)")
          BRANCHES=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.branches.pct)")
          FUNCS=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.functions.pct)")
          echo "Coverage — lines: ${LINES}% | statements: ${STMTS}% | branches: ${BRANCHES}% | functions: ${FUNCS}%"

          # Hard floor: fail if lines drop below this
          THRESHOLD=40
          PASS=$(node -e "console.log(Number($LINES)>=$THRESHOLD?'yes':'no')")
          if [ "$PASS" != "yes" ]; then
            echo "::error::Line coverage ${LINES}% is below minimum threshold ${THRESHOLD}%"
            exit 1
          fi

          # Regression guard: baseline is the last known good coverage.
          # Update BASELINE after intentional coverage improvements.
          BASELINE=54
          REGRESSED=$(node -e "console.log(Number($LINES)<$BASELINE?'yes':'no')")
          if [ "$REGRESSED" = "yes" ]; then
            echo "::error::Line coverage regressed from ${BASELINE}% to ${LINES}%. Add tests before merging."
            exit 1
          fi
          echo "✓ Coverage OK (floor=${THRESHOLD}%, baseline=${BASELINE}%, actual=${LINES}%)"

      - name: Build API & Web (parallel)
        run: |
          cd services/api && pnpm build &
          PID_API=$!
          cd apps/web && pnpm build &
          PID_WEB=$!
          wait $PID_API || exit 1
          wait $PID_WEB || exit 1
